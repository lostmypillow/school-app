name: CI & Staging Deploy (PR)

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci

  #      - name: Run Type Checks
  #        run: npm run typecheck
  #
  #      - name: Linting (Oxlint)
  #        run: npm run lint:oxlint
  #
  #      - name: Linting (ESLint)
  #        run: npm run lint:eslint


  deploy-staging:
    name: Deploy Staging Stack
    needs: test
    runs-on: host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Deploy Self-Hosted Dev Containers
        run: |
          echo "Deploying updated Docker containers to Dev environment..."
          docker compose -f compose.dev.yaml down
          docker compose -f compose.dev.yaml up -d --build
